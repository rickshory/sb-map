<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Scotch Broom Clump Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, sans-serif; }
  #map { height: 100%; width: 100%; }

  #title-bar {
    position: absolute; top: 10px; left: 50px; z-index: 1000;
    background: white; padding: 8px 16px; border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.25); font-size: 15px; font-weight: 600;
    color: #333;
  }
  #title-bar .caption {
    font-size: 12px; font-weight: 400; color: #777; margin-top: 2px;
  }

  #legend {
    position: absolute; bottom: 24px; left: 10px; z-index: 1000;
    background: white; padding: 12px 14px; border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.25); font-size: 13px; color: #333;
    line-height: 1.5;
  }
  #legend h4 { margin: 0 0 8px 0; font-size: 13px; }
  .legend-row { display: flex; align-items: center; margin-bottom: 4px; }
  .legend-dot {
    display: inline-block; border-radius: 50%;
    background: #d9534f; opacity: 0.55; border: 1.5px solid #a83232;
    margin-right: 8px; flex-shrink: 0;
  }
  .legend-dot.dim {
    background: #bbbbbb; opacity: 0.4; border: 1.5px solid #999999;
  }
  .legend-note { font-size: 11px; color: #777; margin-top: 6px; max-width: 190px; }

  .popup-label { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
  .popup-count { font-size: 13px; color: #a83232; margin-bottom: 4px; }
  .popup-notes { font-size: 12px; color: #555; }
</style>
</head>
<body>

<div id="title-bar">
  Scotch Broom — Existing Clumps
  <div class="caption" id="caption"></div>
</div>
<div id="map"></div>

<div id="legend">
  <h4>Clump size</h4>
  <div class="legend-row"><span class="legend-dot" style="width:10px; height:10px;"></span> ~5 plants</div>
  <div class="legend-row"><span class="legend-dot" style="width:20px; height:20px;"></span> ~40 plants</div>
  <div class="legend-row"><span class="legend-dot" style="width:32px; height:32px;"></span> ~150 plants</div>
  <div class="legend-note" id="legend-note">Circle size reflects plant count (area scales with count). Click a circle for details.</div>
</div>

<script src="data.js"></script>
<script>
const BASE_RADIUS = 4;
const SCALE_MULT = 3;

// ---- Read ?agency=xxx from the URL, if present ----
const params = new URLSearchParams(window.location.search);
const agencyFilter = params.get('agency');

function isRelevant(clump) {
  if (!agencyFilter) return true;
  return Array.isArray(clump.agencies) && clump.agencies.includes(agencyFilter);
}

// Center map on the average of all clump points (full dataset, before framing)
const avgLat = CLUMPS.reduce((s, c) => s + c.lat, 0) / CLUMPS.length;
const avgLon = CLUMPS.reduce((s, c) => s + c.lon, 0) / CLUMPS.length;

const map = L.map('map').setView([avgLat, avgLon], 17);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 20,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

function radiusFor(count) {
  return BASE_RADIUS + SCALE_MULT * Math.sqrt(count);
}

// ---- Draw every clump, always. Relevant ones are highlighted; others dimmed. ----
CLUMPS.forEach(c => {
  const relevant = isRelevant(c);
  const r = radiusFor(c.count);
  const circle = L.circleMarker([c.lat, c.lon], {
    radius: r,
    color: relevant ? '#a83232' : '#999999',
    weight: 1.5,
    fillColor: relevant ? '#d9534f' : '#bbbbbb',
    fillOpacity: relevant ? 0.55 : 0.25
  });
  const notesHtml = c.notes ? `<div class="popup-notes">${c.notes}</div>` : '';
  circle.bindPopup(
    `<div class="popup-label">${c.label}</div>` +
    `<div class="popup-count">~${c.count} plants</div>` +
    notesHtml
  );
  circle.addTo(map);
});

// ---- Frame the view: zoom to the relevant subset if filtered, else fit everything ----
const relevantClumps = agencyFilter ? CLUMPS.filter(isRelevant) : CLUMPS;
const bounds = relevantClumps.map(c => [c.lat, c.lon]);

if (bounds.length > 1) {
  map.fitBounds(bounds, { padding: [60, 60], maxZoom: 18 });
} else if (bounds.length === 1) {
  map.setView(bounds[0], 17);
}

// ---- Caption + legend note, only shown when a filter is active ----
if (agencyFilter) {
  document.getElementById('caption').textContent =
    `Highlighted: ${agencyFilter} sites — full dataset shown`;
  document.getElementById('legend-note').innerHTML =
    'Circle size reflects plant count. Highlighted (red) circles are relevant to this view; ' +
    'gray circles are other tracked sites, shown for context.' +
    '<div class="legend-row" style="margin-top:8px;"><span class="legend-dot dim" style="width:14px; height:14px;"></span> Other tracked sites</div>';
}
</script>

</body>
</html>
